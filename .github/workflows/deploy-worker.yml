# Modal worker — implementation.md §19 step 3.
# Pull requests deploy to the `staging` Modal environment, main to `main`.
name: Deploy worker

on:
  push:
    branches: [main]
    paths: ['apps/worker/**', '.github/workflows/deploy-worker.yml']
  pull_request:
    paths: ['apps/worker/**', '.github/workflows/deploy-worker.yml']

concurrency:
  group: deploy-worker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: ${{ github.ref == 'refs/heads/main' && 'main' || 'staging' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/worker
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Deploy to Modal
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          MODAL_ENVIRONMENT: ${{ github.ref == 'refs/heads/main' && 'main' || 'staging' }}
        run: |
          if [ -z "$MODAL_TOKEN_ID" ] || [ -z "$MODAL_TOKEN_SECRET" ]; then
            echo "Modal tokens are not configured yet; skipping."
            exit 0
          fi
          python -m pip install --upgrade pip
          python -m pip install modal
          modal deploy --env "$MODAL_ENVIRONMENT" tryitout_worker/app.py
