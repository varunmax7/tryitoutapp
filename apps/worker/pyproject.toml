[project]
name = "tryitout-worker"
version = "0.1.0"
description = "Tryitout GPU worker: body scan, garment analysis and 3D garment builds (Modal)."
requires-python = ">=3.11"
dependencies = [
  "modal>=1.0",
  "fastapi>=0.115",
  "pyjwt[crypto]>=2.9",
  "httpx>=0.27",
  "sentry-sdk>=2.0",
  "supabase>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.6", "mypy>=1.11", "pip-licenses>=5.0"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "S"]
# ANN101/ANN102 (self/cls) are deprecated; S101 is fine inside tests (see per-file ignores).
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "ANN"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
