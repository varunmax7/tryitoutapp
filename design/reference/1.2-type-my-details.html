<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tryitout — Type my details</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&amp;family=Instrument+Sans:wght@400;500;600&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*,*::before,*::after{box-sizing:border-box}
button,input{font:inherit}
a{color:#0E1726}a:hover{color:#3E4A5C}
</style>
<style>html,body{min-height:100%}body{background:#E9ECF0;display:flex;justify-content:center;align-items:flex-start;padding:24px 0}</style>
</head>
<body>
<!-- Tryitout design reference: 1.2-type-my-details. Source of truth for layout, copy, colours and spacing. -->
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F6F7F9; font-family: 'Instrument Sans', system-ui, -apple-system, 'Segoe UI', sans-serif; color: #0E1726; display: flex; flex-direction: column">

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 8px 12px 0; height: 52px; flex: none">
    <a href="1.1-welcome.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 12px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0E1726" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>
    </a>
    <span style="font-size: 14px; font-weight: 600; color: #3E4A5C">Step 1 of 2</span>
    <span style="width: 44px; height: 44px" aria-hidden="true"></span>
  </div>
  <div style="margin: 0 20px; height: 6px; border-radius: 3px; background: #E4E7EC; flex: none" aria-hidden="true">
    <div style="width: 50%; height: 6px; border-radius: 3px; background: #FFC23D"></div>
  </div>

  <div style="flex: 1; min-height: 0; padding: 16px 16px 0; display: flex; flex-direction: column; gap: 12px">
    <div style="padding: 0 4px; display: flex; flex-direction: column; gap: 4px">
      <h1 style="margin: 0; font-family: 'Bricolage Grotesque', 'Instrument Sans', system-ui, sans-serif; font-weight: 700; font-size: 28px; letter-spacing: -0.02em">Tell us about you</h1>
      <p style="margin: 0; font-size: 14px; color: #5B6676">We use this to estimate your chest, waist and more.</p>
    </div>

    <div style="background: #FFFFFF; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 14px">
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
        <div style="display: flex; flex-direction: column; gap: 6px">
          <label for="height" style="font-size: 13px; font-weight: 600; color: #3E4A5C">Height</label>
          <div style="height: 48px; border: 1.5px solid #D9DEE5; border-radius: 12px; display: flex; align-items: center; gap: 4px; padding: 0 10px">
            <input id="height" value="175" inputmode="decimal" readonly style="border: 0; outline: none; background: transparent; width: 100%; min-width: 0; font-family: 'JetBrains Mono', monospace; font-size: 17px; font-weight: 600; color: #0E1726; padding: 0">
            <span style="font-size: 13px; color: #5B6676">cm</span>
          </div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px">
          <label for="weight" style="font-size: 13px; font-weight: 600; color: #3E4A5C">Weight</label>
          <div style="height: 48px; border: 1.5px solid #D9DEE5; border-radius: 12px; display: flex; align-items: center; gap: 4px; padding: 0 10px">
            <input id="weight" value="72" inputmode="decimal" readonly style="border: 0; outline: none; background: transparent; width: 100%; min-width: 0; font-family: 'JetBrains Mono', monospace; font-size: 17px; font-weight: 600; color: #0E1726; padding: 0">
            <span style="font-size: 13px; color: #5B6676">kg</span>
          </div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px">
          <label for="age" style="font-size: 13px; font-weight: 600; color: #3E4A5C">Age</label>
          <div style="height: 48px; border: 1.5px solid #D9DEE5; border-radius: 12px; display: flex; align-items: center; gap: 4px; padding: 0 10px">
            <input id="age" value="24" inputmode="numeric" readonly style="border: 0; outline: none; background: transparent; width: 100%; min-width: 0; font-family: 'JetBrains Mono', monospace; font-size: 17px; font-weight: 600; color: #0E1726; padding: 0">
            <span style="font-size: 13px; color: #5B6676">yrs</span>
          </div>
        </div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <span id="gender-label" style="font-size: 13px; font-weight: 600; color: #3E4A5C">Gender</span>
        <div role="group" aria-labelledby="gender-label" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; background: #F1F3F6; padding: 4px; border-radius: 14px">
          <button aria-pressed="true" style="height: 44px; border: 0; border-radius: 10px; background: #FFFFFF; color: #0E1726; font-weight: 600; font-size: 15px; box-shadow: 0 1px 3px rgba(14,23,38,0.14)">Man</button>
          <button aria-pressed="false" style="height: 44px; border: 0; border-radius: 10px; background: transparent; color: #3E4A5C; font-weight: 500; font-size: 15px">Woman</button>
          <button aria-pressed="false" style="height: 44px; border: 0; border-radius: 10px; background: transparent; color: #3E4A5C; font-weight: 500; font-size: 15px">Other</button>
        </div>
      </div>
    </div>

    <div style="background: #FFFFFF; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
      <span id="shape-label" style="font-size: 15px; font-weight: 600">Which shape looks most like you?</span>
      <div role="group" aria-labelledby="shape-label" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
        <button aria-pressed="false" style="height: 92px; border: 1.5px solid #E4E7EC; border-radius: 14px; background: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 6px; color: #3E4A5C">
          <svg width="30" height="42" viewBox="0 0 40 56" aria-hidden="true"><circle cx="20" cy="5" r="4.5" fill="#AEB7C4"></circle><path d="M14 12h12l3 6-1 18 2 18H10l2-18-1-18z" fill="#AEB7C4"></path></svg>
          <span style="font-size: 13px; font-weight: 500">Slim</span>
        </button>
        <button aria-pressed="true" style="position: relative; height: 92px; border: 2px solid #0E1726; border-radius: 14px; background: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 6px; color: #0E1726">
          <span style="position: absolute; top: 6px; right: 6px; width: 18px; height: 18px; border-radius: 9px; background: #FFC23D; display: flex; align-items: center; justify-content: center" aria-hidden="true"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#0E1726" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>
          <svg width="30" height="42" viewBox="0 0 40 56" aria-hidden="true"><circle cx="20" cy="5" r="4.5" fill="#0E1726"></circle><path d="M7 12h26l2 6-6 18 2 18H11l2-18-6-18z" fill="#0E1726"></path></svg>
          <span style="font-size: 13px; font-weight: 600">Athletic</span>
        </button>
        <button aria-pressed="false" style="height: 92px; border: 1.5px solid #E4E7EC; border-radius: 14px; background: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 6px; color: #3E4A5C">
          <svg width="30" height="42" viewBox="0 0 40 56" aria-hidden="true"><circle cx="20" cy="5" r="4.5" fill="#AEB7C4"></circle><path d="M11 12h18l3 6-2 18 2 18H10l2-18-2-18z" fill="#AEB7C4"></path></svg>
          <span style="font-size: 13px; font-weight: 500">Regular</span>
        </button>
        <button aria-pressed="false" style="height: 92px; border: 1.5px solid #E4E7EC; border-radius: 14px; background: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 6px; color: #3E4A5C">
          <svg width="30" height="42" viewBox="0 0 40 56" aria-hidden="true"><circle cx="20" cy="5" r="4.5" fill="#AEB7C4"></circle><path d="M9 12h22l3 6 1 18 1 18H6l1-18 1-18z" fill="#AEB7C4"></path></svg>
          <span style="font-size: 13px; font-weight: 500">Broad</span>
        </button>
      </div>
      <span id="pref-label" style="font-size: 15px; font-weight: 600; margin-top: 4px">How do you like clothes to fit?</span>
      <div role="group" aria-labelledby="pref-label" style="display: flex; gap: 8px">
        <button aria-pressed="false" style="flex: 1; height: 44px; border: 1.5px solid #E4E7EC; border-radius: 999px; background: #FFFFFF; color: #3E4A5C; font-size: 15px; font-weight: 500">Slim</button>
        <button aria-pressed="true" style="flex: 1; height: 44px; border: 1.5px solid #0E1726; border-radius: 999px; background: #0E1726; color: #FFFFFF; font-size: 15px; font-weight: 600">Regular</button>
        <button aria-pressed="false" style="flex: 1; height: 44px; border: 1.5px solid #E4E7EC; border-radius: 999px; background: #FFFFFF; color: #3E4A5C; font-size: 15px; font-weight: 500">Relaxed</button>
      </div>
    </div>

    <div style="background: #FFFFFF; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
        <span style="display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600">
          <span style="width: 26px; height: 26px; border-radius: 8px; background: #FFC23D; display: flex; align-items: center; justify-content: center" aria-hidden="true"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#0E1726" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12V4h8l10 10-8 8z"></path><circle cx="7.5" cy="8.5" r="1.5"></circle></svg></span>
          Boost accuracy
        </span>
        <a href="1.3-scan-me.html" style="font-size: 14px; font-weight: 600; min-height: 44px; display: flex; align-items: center; text-underline-offset: 3px">Scan a size tag</a>
      </div>
      <p style="margin: 0; font-size: 14px; color: #5B6676">Add one brand and size that already fits you well.</p>
      <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 10px">
        <div style="display: flex; flex-direction: column; gap: 6px">
          <label for="anchor-brand" style="font-size: 13px; font-weight: 600; color: #3E4A5C">Brand</label>
          <div style="height: 48px; border: 1.5px solid #D9DEE5; border-radius: 12px; display: flex; align-items: center; padding: 0 12px">
            <input id="anchor-brand" value="Roadster" readonly style="border: 0; outline: none; background: transparent; width: 100%; min-width: 0; font-size: 16px; font-weight: 600; color: #0E1726; padding: 0">
          </div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px">
          <label for="anchor-size" style="font-size: 13px; font-weight: 600; color: #3E4A5C">Size</label>
          <div style="height: 48px; border: 1.5px solid #D9DEE5; border-radius: 12px; display: flex; align-items: center; padding: 0 12px">
            <input id="anchor-size" value="M" readonly style="border: 0; outline: none; background: transparent; width: 100%; min-width: 0; font-family: 'JetBrains Mono', monospace; font-size: 16px; font-weight: 600; color: #0E1726; padding: 0">
          </div>
        </div>
      </div>
    </div>
  </div>

  <div style="padding: 12px 16px 20px; flex: none">
    <a href="1.4-my-sizes.html" style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 54px; border-radius: 16px; background: #0E1726; color: #FFFFFF; font-weight: 600; font-size: 17px; text-decoration: none">See my sizes</a>
  </div>
</div>
</body>
</html>
