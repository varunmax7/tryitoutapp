<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tryitout — Live fit check</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&amp;family=Instrument+Sans:wght@400;500;600&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*,*::before,*::after{box-sizing:border-box}
button,input{font:inherit}
a{color:#0E1726}a:hover{color:#3E4A5C}
</style>
<style>html,body{min-height:100%}body{background:#E9ECF0;display:flex;justify-content:center;align-items:flex-start;padding:24px 0}</style>
</head>
<body>
<!-- Tryitout design reference: 2.3-live-fit-check. Source of truth for layout, copy, colours and spacing. -->
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0B1220; font-family: 'Instrument Sans', system-ui, -apple-system, 'Segoe UI', sans-serif; color: #FFFFFF">

  <svg width="390" height="844" viewBox="0 0 390 844" role="img" aria-label="Live camera view of you wearing the Snitch tee in size L with a fit map: shoulders and chest just right, biceps snug, waist roomy" style="position: absolute; left: 0; top: 0">
    <defs>
      <clipPath id="lf-torso"><path d="M180 184Q195 198 210 184L266 202L258 262L260 366Q195 372 130 366L132 262L124 202Z"></path></clipPath>
    </defs>
    <rect width="390" height="520" fill="#131C2E"></rect>
    <rect y="520" width="390" height="324" fill="#0D1524"></rect>
    <path d="M0 520H390" stroke="#1E2A40" stroke-width="2"></path>
    <g transform="translate(195 586) scale(0.86) translate(-195 -586)">
      <ellipse cx="195" cy="588" rx="86" ry="9" fill="#000000" opacity="0.35"></ellipse>
      <path d="M102 279L92 344L88 404L104 406L112 346L127 286Z" fill="#B07A57"></path>
      <path d="M288 279L298 344L302 404L286 406L278 346L263 286Z" fill="#B07A57"></path>
      <ellipse cx="96" cy="418" rx="9" ry="13" fill="#B07A57"></ellipse>
      <ellipse cx="294" cy="418" rx="9" ry="13" fill="#B07A57"></ellipse>
      <path d="M140 356H250L246 566H206L197 432H193L184 566H144Z" fill="#2E4A6E"></path>
      <path d="M195 360V430" stroke="#22395A" stroke-width="2"></path>
      <path d="M142 566H186L189 580Q164 587 136 582Z" fill="#E9ECF1"></path>
      <path d="M204 566H248L254 582Q226 587 201 580Z" fill="#E9ECF1"></path>
      <rect x="184" y="160" width="22" height="36" fill="#9C6A4A"></rect>
      <ellipse cx="195" cy="136" rx="27" ry="33" fill="#B07A57"></ellipse>
      <path d="M168 134Q165 100 195 98Q225 100 222 134Q215 114 195 113Q175 114 168 134Z" fill="#1B1512"></path>
      <path d="M180 184Q195 198 210 184L266 202L258 262L260 366Q195 372 130 366L132 262L124 202Z" fill="#6E7C4E"></path>
      <path d="M124 202L98 276L130 286L132 262Z" fill="#6E7C4E"></path>
      <path d="M266 202L292 276L260 286L258 262Z" fill="#6E7C4E"></path>
      <g opacity="0.9">
        <g clip-path="url(#lf-torso)">
          <rect x="110" y="170" width="170" height="210" fill="#7FD8BE"></rect>
          <path d="M110 312Q195 296 280 312V380H110Z" fill="#6C9BF2"></path>
          <path d="M110 312Q195 296 280 312" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6"></path>
        </g>
        <path d="M124 202L98 276L130 286L132 262Z" fill="#F4A261"></path>
        <path d="M266 202L292 276L260 286L258 262Z" fill="#F4A261"></path>
      </g>
      <g fill="none" stroke="#0B1220" stroke-linecap="round" opacity="0.3">
        <path d="M180 184Q195 198 210 184" stroke-width="3"></path>
        <path d="M124 202L132 262M266 202L258 262" stroke-width="1.5"></path>
        <path d="M158 236q6 22 2 46M232 238q-6 22-2 44M176 330q3 16 0 34M214 330q-3 16 0 34" stroke-width="1.5"></path>
      </g>
    </g>
    <g fill="none" stroke="#FFFFFF" stroke-width="1.25" opacity="0.85">
      <path d="M252 224L223 285"></path>
      <path d="M104 303H131"></path>
      <path d="M262 462L227 371"></path>
    </g>
    <g stroke="#0B1220" stroke-width="2">
      <circle cx="223" cy="285" r="5" fill="#7FD8BE"></circle>
      <circle cx="131" cy="302" r="5" fill="#F4A261"></circle>
      <circle cx="227" cy="371" r="5" fill="#6C9BF2"></circle>
    </g>
  </svg>

  <div style="position: absolute; left: 16px; right: 16px; top: 12px; height: 44px; display: flex; align-items: center; justify-content: space-between">
    <a href="2.1-try-it-on.html" aria-label="Close live fit check" style="width: 44px; height: 44px; border-radius: 22px; background: rgba(11,18,32,0.72); border: 1px solid #2A3650; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </a>
    <span style="height: 36px; padding: 0 14px; border-radius: 999px; background: rgba(11,18,32,0.72); border: 1px solid #2A3650; display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600">
      <span style="width: 8px; height: 8px; border-radius: 4px; background: #FFC23D" aria-hidden="true"></span>
      Live · Snitch tee, size L
    </span>
    <button aria-label="Switch camera" style="width: 44px; height: 44px; border-radius: 22px; background: rgba(11,18,32,0.72); border: 1px solid #2A3650; display: flex; align-items: center; justify-content: center; padding: 0">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><path d="M9 13a3 3 0 0 1 5.2-2M15 13a3 3 0 0 1-5.2 2"></path><path d="M14.4 9.4V11h-1.6M9.6 16.6V15h1.6"></path></svg>
    </button>
  </div>

  <div style="position: absolute; left: 12px; top: 68px; padding: 8px 10px; border-radius: 12px; background: rgba(11,18,32,0.82); border: 1px solid #2A3650; display: flex; flex-direction: column; gap: 5px">
    <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #C9D1DC">Fit map</span>
    <span style="display: flex; align-items: center; gap: 7px; font-size: 12px; color: #E6EAF0"><span style="width: 12px; height: 12px; border-radius: 3px; background: #F4A261" aria-hidden="true"></span>Snug</span>
    <span style="display: flex; align-items: center; gap: 7px; font-size: 12px; color: #E6EAF0"><span style="width: 12px; height: 12px; border-radius: 3px; background: #7FD8BE" aria-hidden="true"></span>Just right</span>
    <span style="display: flex; align-items: center; gap: 7px; font-size: 12px; color: #E6EAF0"><span style="width: 12px; height: 12px; border-radius: 3px; background: #6C9BF2" aria-hidden="true"></span>Roomy</span>
  </div>

  <div style="position: absolute; left: 238px; top: 178px; padding: 6px 10px; border-radius: 10px; background: rgba(11,18,32,0.86); border: 1px solid #2A3650; border-left: 3px solid #7FD8BE; display: flex; flex-direction: column">
    <span style="font-size: 13px; font-weight: 600; line-height: 18px">Just right</span>
    <span style="font-size: 12px; line-height: 16px; color: #C9D1DC">Shoulders &amp; chest</span>
  </div>
  <div style="position: absolute; left: 8px; top: 280px; padding: 6px 10px; border-radius: 10px; background: rgba(11,18,32,0.86); border: 1px solid #2A3650; border-left: 3px solid #F4A261; display: flex; flex-direction: column">
    <span style="font-size: 13px; font-weight: 600; line-height: 18px">Snug</span>
    <span style="font-size: 12px; line-height: 16px; color: #C9D1DC">Biceps +2 cm</span>
  </div>
  <div style="position: absolute; left: 252px; top: 462px; padding: 6px 10px; border-radius: 10px; background: rgba(11,18,32,0.86); border: 1px solid #2A3650; border-left: 3px solid #6C9BF2; display: flex; flex-direction: column">
    <span style="font-size: 13px; font-weight: 600; line-height: 18px">Roomy</span>
    <span style="font-size: 12px; line-height: 16px; color: #C9D1DC">Waist, by design</span>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 220px; background: #111A2B; border-top: 1px solid #22304A; border-radius: 24px 24px 0 0; padding: 14px 16px 18px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
      <div role="group" aria-label="Size shown" style="display: flex; gap: 2px; padding: 3px; border-radius: 15px; background: #0B1220; border: 1px solid #2A3650">
        <button aria-pressed="false" style="height: 44px; min-width: 56px; padding: 0 14px; border: 0; border-radius: 12px; background: transparent; color: #E6EAF0; font-family: 'JetBrains Mono', monospace; font-size: 15px; font-weight: 600">M</button>
        <button aria-pressed="true" style="height: 44px; padding: 0 14px; border: 0; border-radius: 12px; background: #FFC23D; color: #0E1726; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 6px">
          <span style="font-family: 'JetBrains Mono', monospace; font-size: 15px">L</span>
          Your size
        </button>
      </div>
      <div style="display: flex; align-items: center; gap: 10px">
        <span id="fitmap-label" style="font-size: 14px; font-weight: 600; color: #E6EAF0">Fit map</span>
        <button role="switch" aria-checked="true" aria-labelledby="fitmap-label" style="width: 52px; height: 32px; flex: none; border: 0; border-radius: 16px; background: #6EE7B7; padding: 3px; display: flex; justify-content: flex-end">
          <span style="width: 26px; height: 26px; border-radius: 13px; background: #0B1220" aria-hidden="true"></span>
        </button>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 10px">
      <span style="display: inline-flex; align-items: center; gap: 5px; height: 26px; padding: 0 10px; border-radius: 999px; background: #DDF3EA; color: #0B6B4F; font-size: 13px; font-weight: 600; flex: none">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#0B6B4F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
        Good fit
      </span>
      <span style="font-size: 14px; color: #C9D1DC">L fits well and ends at your hip.</span>
    </div>

    <div style="margin-top: auto; display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: start">
      <button style="justify-self: center; border: 0; background: transparent; color: #E6EAF0; padding: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; font-weight: 600">
        <span style="width: 48px; height: 48px; border-radius: 24px; background: #1B263B; border: 1px solid #2A3650; display: flex; align-items: center; justify-content: center" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"></circle><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"></path><circle cx="17" cy="9" r="2.6"></circle><path d="M16 14.2c2.8.4 5 2.8 5 5.8"></path></svg>
        </span>
        Ask family
      </button>
      <button style="border: 0; background: transparent; color: #E6EAF0; padding: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; font-weight: 600">
        <span style="width: 64px; height: 64px; border-radius: 32px; border: 4px solid #FFFFFF; display: flex; align-items: center; justify-content: center" aria-hidden="true">
          <span style="width: 48px; height: 48px; border-radius: 24px; background: #FFFFFF"></span>
        </span>
        Snap
      </button>
      <button style="justify-self: center; border: 0; background: transparent; color: #E6EAF0; padding: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; font-weight: 600">
        <span style="width: 48px; height: 48px; border-radius: 24px; background: #1B263B; border: 1px solid #2A3650; display: flex; align-items: center; justify-content: center" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"></path><path d="M12 12l8-4.5M12 12L4 7.5M12 12v9"></path></svg>
        </span>
        3D view
      </button>
    </div>
  </div>
</div>
</body>
</html>
