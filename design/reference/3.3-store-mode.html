<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tryitout — Store mode</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&amp;family=Instrument+Sans:wght@400;500;600&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*,*::before,*::after{box-sizing:border-box}
button,input{font:inherit}
a{color:#0E1726}a:hover{color:#3E4A5C}
</style>
<style>html,body{min-height:100%}body{background:#E9ECF0;display:flex;justify-content:center;align-items:flex-start;padding:24px 0}</style>
</head>
<body>
<!-- Tryitout design reference: 3.3-store-mode. Source of truth for layout, copy, colours and spacing. -->
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F6F7F9; font-family: 'Instrument Sans', system-ui, -apple-system, 'Segoe UI', sans-serif; color: #0E1726; display: flex; flex-direction: column">

  <div style="flex: 1; min-height: 0; padding: 16px 16px 0; display: flex; flex-direction: column">
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 4px">
      <h1 style="margin: 0; font-family: 'Bricolage Grotesque', 'Instrument Sans', system-ui, sans-serif; font-weight: 700; font-size: 28px; letter-spacing: -0.02em">Store mode</h1>
      <span style="height: 28px; padding: 0 10px; border-radius: 999px; background: #DDF3EA; color: #0B6B4F; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#0B6B4F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5"></path><path d="M5 20h14"></path></svg>
        Works offline
      </span>
    </div>
    <p style="margin: 4px 4px 0; font-size: 14px; color: #5B6676">In a store? Pick it and grab the right size.</p>

    <span id="store-q" style="margin: 16px 4px 0; font-size: 14px; font-weight: 600; color: #3E4A5C">Which store?</span>
    <div role="radiogroup" aria-labelledby="store-q" style="margin: 8px -16px 0 0; padding-right: 16px; display: flex; gap: 8px; overflow-x: auto">
      <button role="radio" aria-checked="true" style="flex: none; height: 44px; padding: 0 16px 0 12px; border-radius: 999px; border: 1.5px solid #0E1726; background: #0E1726; color: #FFFFFF; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 6px">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFC23D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
        Zudio
      </button>
      <button role="radio" aria-checked="false" style="flex: none; height: 44px; padding: 0 16px; border-radius: 999px; border: 1.5px solid #E4E7EC; background: #FFFFFF; color: #0E1726; font-size: 14px; font-weight: 600">Max</button>
      <button role="radio" aria-checked="false" style="flex: none; height: 44px; padding: 0 16px; border-radius: 999px; border: 1.5px solid #E4E7EC; background: #FFFFFF; color: #0E1726; font-size: 14px; font-weight: 600">Westside</button>
      <button role="radio" aria-checked="false" style="flex: none; height: 44px; padding: 0 16px; border-radius: 999px; border: 1.5px solid #E4E7EC; background: #FFFFFF; color: #0E1726; font-size: 14px; font-weight: 600">Pantaloons</button>
      <button role="radio" aria-checked="false" style="flex: none; height: 44px; padding: 0 16px; border-radius: 999px; border: 1.5px solid #E4E7EC; background: #FFFFFF; color: #0E1726; font-size: 14px; font-weight: 600">Trends</button>
    </div>

    <span id="cat-q" style="margin: 16px 4px 0; font-size: 14px; font-weight: 600; color: #3E4A5C">What are you picking up?</span>
    <div role="radiogroup" aria-labelledby="cat-q" style="margin-top: 8px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <button role="radio" aria-checked="true" style="position: relative; height: 80px; border-radius: 16px; border: 2px solid #0E1726; background: #0E1726; color: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-size: 14px; font-weight: 600">
        <span style="position: absolute; top: 7px; right: 7px; width: 18px; height: 18px; border-radius: 9px; background: #FFC23D; display: flex; align-items: center; justify-content: center" aria-hidden="true"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#0E1726" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8.5 4L4 6.5 2 11l3 1.5 1.5-2V20h11v-9.5l1.5 2 3-1.5-2-4.5L15.5 4q-1.5 2-3.5 2t-3.5-2z"></path></svg>
        T-shirts
      </button>
      <button role="radio" aria-checked="false" style="height: 80px; border-radius: 16px; border: 1.5px solid #E4E7EC; background: #FFFFFF; color: #0E1726; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-size: 14px; font-weight: 600">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#0E1726" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 4L4 6 2.5 11l3 1 1-2.5V20h11V9.5l1 2.5 3-1L20 6l-4-2-4 4z"></path><path d="M12 8v12"></path></svg>
        Shirts
      </button>
      <button role="radio" aria-checked="false" style="height: 80px; border-radius: 16px; border: 1.5px solid #E4E7EC; background: #FFFFFF; color: #0E1726; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-size: 14px; font-weight: 600">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#0E1726" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12l1 18h-5l-2-11-2 11H5z"></path><path d="M6 6.5h12"></path></svg>
        Jeans
      </button>
      <button role="radio" aria-checked="false" style="height: 80px; border-radius: 16px; border: 1.5px solid #E4E7EC; background: #FFFFFF; color: #0E1726; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-size: 14px; font-weight: 600">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#0E1726" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3h10l1.5 18H14l-2-12-2 12H5.5z"></path><path d="M12 3v6"></path></svg>
        Trousers
      </button>
      <button role="radio" aria-checked="false" style="height: 80px; border-radius: 16px; border: 1.5px solid #E4E7EC; background: #FFFFFF; color: #0E1726; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-size: 14px; font-weight: 600">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#0E1726" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3L5 5 3 10l3 1 1-2v12h10V9l1 2 3-1-2-5-4-2-3 3z"></path><path d="M12 6v5"></path></svg>
        Kurtas
      </button>
      <button role="radio" aria-checked="false" style="height: 80px; border-radius: 16px; border: 1.5px solid #E4E7EC; background: #FFFFFF; color: #0E1726; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-size: 14px; font-weight: 600">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#0E1726" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 17v-6l6-1 3 3 9 2a2 2 0 0 1 2 2v1H2z"></path><path d="M2 19.5h20"></path></svg>
        Shoes
      </button>
    </div>

    <div aria-live="polite" style="margin-top: 16px; position: relative; overflow: hidden; border-radius: 22px; background: #FFC23D; padding: 16px 18px 26px">
      <span style="font-size: 13px; font-weight: 600">At Zudio · T-shirts, regular fit</span>
      <div style="margin-top: 2px; display: flex; align-items: baseline; justify-content: space-between; gap: 12px">
        <span style="font-family: 'Bricolage Grotesque', 'Instrument Sans', sans-serif; font-weight: 700; font-size: 46px; line-height: 1.05; letter-spacing: -0.02em">Grab L</span>
        <span style="height: 28px; padding: 0 10px; border-radius: 999px; background: #E1EBFA; color: #1E4FA3; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; flex: none">Slightly loose</span>
      </div>
      <p style="margin: 6px 0 0; font-size: 14px">M will feel tight across your chest.</p>
      <svg width="100%" height="12" aria-hidden="true" style="position: absolute; left: 0; bottom: 0; display: block">
        <defs><pattern id="sm-ticks" width="35" height="12" patternUnits="userSpaceOnUse"><path d="M3.5 12V2M10.5 12V7M17.5 12V7M24.5 12V7M31.5 12V7" stroke="#0E1726" stroke-width="1.2" opacity="0.45"></path></pattern></defs>
        <rect width="100%" height="12" fill="url(#sm-ticks)"></rect>
      </svg>
    </div>

    <button style="margin-top: 12px; min-height: 64px; padding: 10px 14px; border-radius: 18px; border: 1px solid #E4E7EC; background: #FFFFFF; color: #0E1726; display: flex; align-items: center; gap: 12px; text-align: left">
      <span style="width: 40px; height: 40px; flex: none; border-radius: 12px; background: #F1F3F6; display: flex; align-items: center; justify-content: center" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0E1726" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12.5V4a1 1 0 0 1 1-1h8.5L21 11.5 12.5 20z"></path><circle cx="8" cy="8" r="1.6"></circle></svg>
      </span>
      <span style="flex: 1; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 15px; font-weight: 600">Scan the size tag</span>
        <span style="font-size: 13px; color: #5B6676">Sizes can differ by batch. We'll double-check this piece.</span>
      </span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5B6676" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
    </button>
  </div>

  <nav aria-label="Main" style="flex: none; height: 74px; margin-top: 10px; background: #FFFFFF; border-top: 1px solid #E4E7EC; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 6px 8px 10px">
    <a href="1.4-my-sizes.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #5B6676; font-size: 12px; font-weight: 500">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#5B6676" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="8" width="18" height="8" rx="1.5"></rect><path d="M7 8v3M11 8v4M15 8v3M19 8v2"></path></svg>
      Sizes
      <span style="width: 18px; height: 3px" aria-hidden="true"></span>
    </a>
    <a href="2.1-try-it-on.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #5B6676; font-size: 12px; font-weight: 500">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#5B6676" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"></path><path d="M12 12l8-4.5M12 12L4 7.5M12 12v9"></path></svg>
      Try on
      <span style="width: 18px; height: 3px" aria-hidden="true"></span>
    </a>
    <a href="3.3-store-mode.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #0E1726; font-size: 12px; font-weight: 600">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0E1726" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9l2-5h14l2 5"></path><path d="M4 9v11h16V9"></path><path d="M9 20v-6h6v6"></path></svg>
      Store
      <span style="width: 18px; height: 3px; border-radius: 2px; background: #FFC23D" aria-hidden="true"></span>
    </a>
    <a href="3.4-me-family-tools.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #5B6676; font-size: 12px; font-weight: 500">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#5B6676" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"></path></svg>
      Me
      <span style="width: 18px; height: 3px" aria-hidden="true"></span>
    </a>
  </nav>
</div>
</body>
</html>
