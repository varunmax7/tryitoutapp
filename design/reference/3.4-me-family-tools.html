<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tryitout — Family &amp; tools</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&amp;family=Instrument+Sans:wght@400;500;600&amp;family=JetBrains+Mono:wght@500;600&amp;family=Noto+Sans+Devanagari:wght@500&amp;family=Noto+Sans+Telugu:wght@500&amp;family=Noto+Sans+Tamil:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*,*::before,*::after{box-sizing:border-box}
button,input{font:inherit}
a{color:#0E1726}a:hover{color:#3E4A5C}
</style>
<style>html,body{min-height:100%}body{background:#E9ECF0;display:flex;justify-content:center;align-items:flex-start;padding:24px 0}</style>
</head>
<body>
<!-- Tryitout design reference: 3.4-me-family-tools. Source of truth for layout, copy, colours and spacing. -->
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F6F7F9; font-family: 'Instrument Sans', system-ui, -apple-system, 'Segoe UI', sans-serif; color: #0E1726; display: flex; flex-direction: column">

  <div style="flex: 1; min-height: 0; padding: 16px 16px 0; display: flex; flex-direction: column">
    <h1 style="margin: 0 4px; font-family: 'Bricolage Grotesque', 'Instrument Sans', system-ui, sans-serif; font-weight: 700; font-size: 28px; letter-spacing: -0.02em">Family &amp; tools</h1>

    <span id="who-q" style="margin: 14px 4px 0; font-size: 14px; font-weight: 600; color: #3E4A5C">Whose sizes?</span>
    <div role="radiogroup" aria-labelledby="who-q" style="margin-top: 10px; display: flex; justify-content: space-between">
      <button role="radio" aria-checked="true" style="width: 66px; border: 0; background: transparent; padding: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #0E1726">
        <span style="width: 58px; height: 58px; border-radius: 29px; border: 3px solid #FFC23D; padding: 2px; display: flex" aria-hidden="true">
          <span style="flex: 1; border-radius: 50%; background: #0E1726; color: #FFC23D; display: flex; align-items: center; justify-content: center; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 20px">A</span>
        </span>
        <span style="font-size: 13px; font-weight: 600">Aarav</span>
        <span style="font-size: 11px; color: #5B6676; margin-top: -3px">You</span>
      </button>
      <button role="radio" aria-checked="false" style="width: 66px; border: 0; background: transparent; padding: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #0E1726">
        <span style="width: 58px; height: 58px; border-radius: 29px; padding: 5px; display: flex" aria-hidden="true">
          <span style="flex: 1; border-radius: 50%; background: #FDE9DA; color: #9A3A06; display: flex; align-items: center; justify-content: center; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 20px">M</span>
        </span>
        <span style="font-size: 13px; font-weight: 600">Maa</span>
        <span style="font-size: 11px; color: #5B6676; margin-top: -3px">Kurtas</span>
      </button>
      <button role="radio" aria-checked="false" style="width: 66px; border: 0; background: transparent; padding: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #0E1726">
        <span style="width: 58px; height: 58px; border-radius: 29px; padding: 5px; display: flex" aria-hidden="true">
          <span style="flex: 1; border-radius: 50%; background: #E1EBFA; color: #1E4FA3; display: flex; align-items: center; justify-content: center; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 20px">P</span>
        </span>
        <span style="font-size: 13px; font-weight: 600">Papa</span>
        <span style="font-size: 11px; color: #5B6676; margin-top: -3px">Shirts</span>
      </button>
      <button role="radio" aria-checked="false" style="width: 66px; border: 0; background: transparent; padding: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #0E1726">
        <span style="width: 58px; height: 58px; border-radius: 29px; padding: 5px; display: flex" aria-hidden="true">
          <span style="flex: 1; border-radius: 50%; background: #DDF3EA; color: #0B6B4F; display: flex; align-items: center; justify-content: center; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 20px">R</span>
        </span>
        <span style="font-size: 13px; font-weight: 600">Riya</span>
        <span style="font-size: 11px; color: #5B6676; margin-top: -3px">Age 8</span>
      </button>
      <button style="width: 66px; border: 0; background: transparent; padding: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #0E1726">
        <span style="width: 58px; height: 58px; border-radius: 29px; padding: 5px; display: flex" aria-hidden="true">
          <span style="flex: 1; border-radius: 50%; border: 1.5px dashed #AEB7C4; background: #FFFFFF; display: flex; align-items: center; justify-content: center">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3E4A5C" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
          </span>
        </span>
        <span style="font-size: 13px; font-weight: 600">Add</span>
        <span style="font-size: 11px; color: #5B6676; margin-top: -3px">Person</span>
      </button>
    </div>

    <div style="margin-top: 14px; background: #FFFFFF; border-radius: 18px; padding: 12px 12px 12px 14px; display: flex; align-items: center; gap: 12px">
      <span style="flex: 1; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 15px; font-weight: 600">Aarav's sizes</span>
        <span style="font-size: 13px; color: #5B6676">From a body scan · chest <span style="font-family: 'JetBrains Mono', monospace; font-weight: 600; color: #0E1726">98</span> cm</span>
      </span>
      <a href="1.3-scan-me.html" style="height: 44px; padding: 0 14px; border-radius: 12px; border: 1.5px solid #D9DEE5; display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; text-decoration: none">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0E1726" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"></path><circle cx="12" cy="12" r="3"></circle></svg>
        Rescan
      </a>
    </div>

    <h2 style="margin: 18px 4px 0; font-size: 14px; font-weight: 600; color: #3E4A5C">Tools</h2>
    <div style="margin-top: 8px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <button style="height: 96px; padding: 12px; border-radius: 18px; border: 1px solid #E4E7EC; background: #FFFFFF; color: #0E1726; display: flex; flex-direction: column; align-items: flex-start; text-align: left">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#0E1726" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 17v-6l6-1 3 3 9 2a2 2 0 0 1 2 2v1H2z"></path><path d="M2 19.5h20"></path></svg>
        <span style="margin-top: 8px; font-size: 15px; font-weight: 600">Shoe size</span>
        <span style="font-size: 12px; color: #5B6676">Stand on an A4 sheet</span>
      </button>
      <button style="height: 96px; padding: 12px; border-radius: 18px; border: 1px solid #E4E7EC; background: #FFFFFF; color: #0E1726; display: flex; flex-direction: column; align-items: flex-start; text-align: left">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#0E1726" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="6" r="3"></circle><circle cx="6" cy="18" r="3"></circle><path d="M8.2 8.2L20 20M8.2 15.8L20 4"></path></svg>
        <span style="margin-top: 8px; font-size: 15px; font-weight: 600">Tailor card</span>
        <span style="font-size: 12px; color: #5B6676">Send cm to your tailor</span>
      </button>
      <button style="height: 96px; padding: 12px; border-radius: 18px; border: 1px solid #E4E7EC; background: #FFFFFF; color: #0E1726; display: flex; flex-direction: column; align-items: flex-start; text-align: left">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#0E1726" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path><path d="M8 11h6M11 8v6"></path></svg>
        <span style="margin-top: 8px; font-size: 15px; font-weight: 600">Find it in my size</span>
        <span style="font-size: 12px; color: #5B6676">Stores with your size</span>
      </button>
      <button style="height: 96px; padding: 12px; border-radius: 18px; border: 1px solid #E4E7EC; background: #FFFFFF; color: #0E1726; display: flex; flex-direction: column; align-items: flex-start; text-align: left">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#0E1726" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3L5 5 3 10l3 1 1-2v12h10V9l1 2 3-1-2-5-4-2-3 3z"></path><path d="M12 6v5"></path></svg>
        <span style="margin-top: 8px; font-size: 15px; font-weight: 600">Ethnic &amp; plus-size</span>
        <span style="font-size: 12px; color: #5B6676">Kurtas, blouses, 3XL+</span>
      </button>
      <button style="height: 96px; padding: 12px; border-radius: 18px; border: 1px solid #E4E7EC; background: #FFFFFF; color: #0E1726; display: flex; flex-direction: column; align-items: flex-start; text-align: left">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#0E1726" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
        <span style="margin-top: 8px; font-size: 15px; font-weight: 600">Lingerie fit</span>
        <span style="font-size: 12px; color: #5B6676">Private quiz, no photos</span>
      </button>
      <button style="height: 96px; padding: 12px; border-radius: 18px; border: 1px solid #E4E7EC; background: #FFFFFF; color: #0E1726; display: flex; flex-direction: column; align-items: flex-start; text-align: left">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#0E1726" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3c2.5 2.5 3.8 5.5 3.8 9s-1.3 6.5-3.8 9c-2.5-2.5-3.8-5.5-3.8-9S9.5 5.5 12 3z"></path></svg>
        <span style="margin-top: 8px; font-size: 15px; font-weight: 600">Language</span>
        <span style="font-size: 12px; color: #5B6676; display: flex; gap: 6px"><span lang="hi" style="font-family: 'Noto Sans Devanagari', sans-serif">हिन्दी</span>·<span lang="te" style="font-family: 'Noto Sans Telugu', sans-serif">తెలుగు</span>·<span lang="ta" style="font-family: 'Noto Sans Tamil', sans-serif">தமிழ்</span></span>
      </button>
    </div>

    <div style="margin-top: 14px; background: #FFFFFF; border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; gap: 10px; align-items: flex-start">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0B6B4F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 1px"><path d="M12 3l7 3v5c0 4.5-3 8.5-7 10-4-1.5-7-5.5-7-10V6z"></path><path d="M9 12l2 2 4-4"></path></svg>
        <span style="display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 15px; font-weight: 600">Privacy</span>
          <span style="font-size: 13px; color: #3E4A5C">Scan photos are deleted right after measuring. Only your sizes are kept.</span>
        </span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
        <button style="height: 44px; border-radius: 12px; border: 1.5px solid #D9DEE5; background: #FFFFFF; color: #0E1726; font-size: 14px; font-weight: 600">Download my data</button>
        <button style="height: 44px; border-radius: 12px; border: 1.5px solid #F2C7C2; background: #FFFFFF; color: #B42318; font-size: 14px; font-weight: 600">Delete everything</button>
      </div>
    </div>
  </div>

  <nav aria-label="Main" style="flex: none; height: 74px; margin-top: 10px; background: #FFFFFF; border-top: 1px solid #E4E7EC; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 6px 8px 10px">
    <a href="1.4-my-sizes.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #5B6676; font-size: 12px; font-weight: 500">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#5B6676" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="8" width="18" height="8" rx="1.5"></rect><path d="M7 8v3M11 8v4M15 8v3M19 8v2"></path></svg>
      Sizes
      <span style="width: 18px; height: 3px" aria-hidden="true"></span>
    </a>
    <a href="2.1-try-it-on.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #5B6676; font-size: 12px; font-weight: 500">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#5B6676" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"></path><path d="M12 12l8-4.5M12 12L4 7.5M12 12v9"></path></svg>
      Try on
      <span style="width: 18px; height: 3px" aria-hidden="true"></span>
    </a>
    <a href="3.3-store-mode.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #5B6676; font-size: 12px; font-weight: 500">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#5B6676" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9l2-5h14l2 5"></path><path d="M4 9v11h16V9"></path><path d="M9 20v-6h6v6"></path></svg>
      Store
      <span style="width: 18px; height: 3px" aria-hidden="true"></span>
    </a>
    <a href="3.4-me-family-tools.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #0E1726; font-size: 12px; font-weight: 600">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0E1726" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"></path></svg>
      Me
      <span style="width: 18px; height: 3px; border-radius: 2px; background: #FFC23D" aria-hidden="true"></span>
    </a>
  </nav>
</div>
</body>
</html>
